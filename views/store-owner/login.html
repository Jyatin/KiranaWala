<script>
    const loginForm = document.getElementById('loginForm');
    const alertBanner = document.getElementById('auth-alert-banner');
    const alertText = document.getElementById('auth-alert-text');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
        if (alertBanner && alertText) {
            alertText.textContent = msg;
            alertBanner.classList.add('active');
        } else {
            alert(msg);
        }
    }

    function clearError() {
        if (alertBanner) {
            alertBanner.classList.remove('active');
        }
    }

    function resetSubmitButton() {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Open Store Dashboard →';
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showError('Please enter your owner email and password.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        try {
            const response = await fetch('/api/store/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            let result;

            // Safely parse the server response
            try {
                result = await response.json();
            } catch (parseError) {
                console.error('Invalid server response:', parseError);

                showError(
                    response.ok
                        ? 'The server returned an invalid response.'
                        : `Login failed. Server returned status ${response.status}.`
                );

                resetSubmitButton();
                return;
            }

            if (response.ok) {

                // Make sure the server returned a token
                if (!result.token) {
                    showError('Login failed because no authentication token was received.');
                    resetSubmitButton();
                    return;
                }

                localStorage.setItem('token', result.token);

                if (result.storeId) {
                    localStorage.setItem('storeId', result.storeId);
                }

                window.location.href = '/store-owner/dashboard';

            } else {
                const errorMsg =
                    result.message ||
                    result.error ||
                    'Portal authentication error. Please check your credentials.';

                showError(errorMsg);
                resetSubmitButton();
            }

        } catch (error) {
            console.error('Merchant login error:', error);

            showError(
                'Unable to connect to the server. Please try again.'
            );

            resetSubmitButton();
        }
    });
</script>
