name: KiranaWala CI - Build & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6-jammy
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Backend Unit & Integration Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/kiranawala_ci_test
          JWT_SECRET: kiranawala_ci_test_jwt_secret_32_chars_long!
          RAZORPAY_WEBHOOK_SECRET: rzp_test_ci_webhook_secret_32_chars!
        run: npm test -- --runInBand

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend TypeScript Check
        run: npm run type-check

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build
